    <!-- S -->
    <path d="M 175 40 L 250 40 L 250 55 L 145 55 C 130 55 125 65 125 75 C 125 88 135 95 150 95 L 230 95 C 248 95 255 105 255 120 C 255 135 240 145 220 145 L 85 145 L 85 130 L 220 130 C 232 130 236 124 236 118 C 236 110 228 107 215 107 L 140 107 C 115 107 105 92 105 75 C 105 55 125 40 150 40 Z" fill="url(#slayGradient)" />

    <!-- L -->
    <path d="M 190 40 L 208 40 L 208 130 L 255 130 L 255 145 L 190 145 Z" fill="url(#slayGradient)" />

    <!-- A -->
    <path d="M 270 145 L 315 40 L 335 40 L 380 145 L 360 145 L 348 115 L 302 115 L 290 145 Z M 308 100 L 342 100 L 325 58 Z" fill="url(#slayGradient)" />

    <!-- Y -->
    <path d="M 368 40 L 398 90 L 398 145 L 416 145 L 416 90 L 446 40 L 424 40 L 407 72 L 390 40 Z" fill="url(#slayGradient)" />
  </g>

  <!-- WITH RAY Accent Line -->
  <g fill="none" stroke="url(#slayGradient)" stroke-width="2.5" stroke-linecap="round">
    <line x1="85" y1="168" x2="165" y2="168" />
    <path d="M 140 163 L 145 168 L 140 173 M 150 163 L 155 168 L 150 173" />

